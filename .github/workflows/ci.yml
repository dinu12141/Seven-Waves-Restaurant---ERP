# ═══════════════════════════════════════════════════════════════════
# CI Pipeline — Pull Request Checks
# Seven Waves ERP — Step 03E
# ═══════════════════════════════════════════════════════════════════
# Runs on every PR to catch issues before merge.

name: CI — Pull Request

on:
  pull_request:
    branches: [main, staging]
    paths-ignore:
      - '*.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript Check
        run: npm run type-check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run Vitest
        run: npx vitest run --reporter=verbose

  build:
    name: Build Preview
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build SPA
        env:
          VITE_APP_ENV: preview
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
          VITE_ENABLE_PWA: 'true'
          VITE_ENABLE_REALTIME: 'true'
          VITE_ENABLE_OFFLINE: 'true'
        run: npx quasar build

      - name: Verify Build Output
        run: |
          test -f dist/spa/index.html || (echo "❌ Build output missing" && exit 1)
          echo "✅ Build output verified"
          du -sh dist/spa/

      - uses: actions/upload-artifact@v4
        with:
          name: spa-build-${{ github.sha }}
          path: dist/spa/
          retention-days: 3

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Audit Dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check .env Not Tracked by Git
        run: |
          echo "Verifying .env files are not tracked by git..."
          TRACKED=$(git ls-files .env .env.local .env.production .env.staging 2>/dev/null || true)
          if [ -n "$TRACKED" ]; then
            echo "❌ .env file(s) are tracked by git: $TRACKED"
            echo "   Run: git rm --cached $TRACKED && git commit"
            exit 1
          fi
          echo "✅ No .env files tracked"

      - name: Check for Exposed Secrets in Source
        run: |
          echo "Scanning for exposed secrets..."
          # Check no service_role key in source (exclude comment lines starting with //)
          if grep -rn "service_role" src/ --include="*.ts" --include="*.js" --include="*.vue" | grep -v "^\s*//" | grep -v "^\s*\*"; then
            echo "❌ service_role key reference found in source code!"
            exit 1
          fi
          # Check no hardcoded JWTs (Supabase anon/service_role keys start with eyJhbGciOi)
          # in code-bearing directories (keys belong in .env / CI secrets). Only file
          # names are printed, never the token, to avoid re-leaking a key into CI logs.
          JWT_HITS=$(grep -rlI "eyJhbGciOi" scripts/ tests/ src/ supabase/ src-tauri/ \
            --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=target 2>/dev/null || true)
          if [ -n "$JWT_HITS" ]; then
            echo "❌ Hardcoded JWT token(s) found in:"
            echo "$JWT_HITS"
            echo "Use environment variables (e.g. process.env.SUPABASE_SERVICE_ROLE_KEY) instead."
            exit 1
          fi
          # Extra guard: any JWT anywhere in the repo whose payload decodes to role=service_role
          SR_HITS=$(grep -rIoE "eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]+" . \
            --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git --exclude='.env*' 2>/dev/null \
            | while IFS= read -r line; do
                file="${line%%:*}"; tok="${line#*:}"
                payload=$(echo "$tok" | cut -d. -f2 | tr '_-' '/+')
                while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
                if echo "$payload" | base64 -d 2>/dev/null | grep -q '"role":"service_role"'; then echo "$file"; fi
              done | sort -u)
          if [ -n "$SR_HITS" ]; then
            echo "❌ Supabase service_role JWT found in:"
            echo "$SR_HITS"
            exit 1
          fi
          # Third-party API keys that must only live in Supabase/Vercel secrets:
          # Resend (re_xxx_xxx), Stripe (sk_live_/sk_test_), Supabase PAT (sbp_), Google (AIza).
          KEY_HITS=$(grep -rlIE "re_[A-Za-z0-9]{8}_[A-Za-z0-9]{16,}|sk_(live|test)_[A-Za-z0-9]{16,}|sbp_[a-f0-9]{30,}|AIza[0-9A-Za-z_-]{35}" . \
            --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git --exclude-dir=target --exclude='.env*' 2>/dev/null || true)
          if [ -n "$KEY_HITS" ]; then
            echo "❌ Hardcoded third-party API key(s) found in:"
            echo "$KEY_HITS"
            echo "Move the key to a Supabase edge-function secret (supabase secrets set ...) or CI secret."
            exit 1
          fi
          echo "✅ No exposed secrets found in source"

      # Scans only the commits in this PR (history before the key rotation is not re-flagged).
      # Pinned to an exact release; .gitleaks.toml at the repo root extends the default rules.
      - name: Gitleaks — Scan PR Commits for Secrets
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
