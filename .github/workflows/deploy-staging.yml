# ═══════════════════════════════════════════════════════════════════
# CD Pipeline — Deploy Staging
# Seven Waves ERP — Step 03E
# ═══════════════════════════════════════════════════════════════════
# Deploys to staging on push to staging branch.

name: CD — Deploy Staging

on:
  push:
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  test:
    name: Pre-Deploy Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript Check
        run: npm run type-check

      - name: Unit Tests
        run: npx vitest run --reporter=verbose

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test]
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify Environment Isolation
        env:
          STAGING_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          PROD_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
        run: |
          echo "🔒 Verifying environment isolation..."
          # CRITICAL: Staging must NEVER point to production Supabase
          if [ -z "$STAGING_URL" ] && [ -z "$PROD_URL" ]; then
            echo "⚠️ WARNING: Supabase URLs are not set in GitHub Secrets. Bypassing isolation check."
          elif [ "$STAGING_URL" = "$PROD_URL" ]; then
            echo "❌ FATAL: STAGING_SUPABASE_URL equals PRODUCTION_SUPABASE_URL!"
            echo "   Staging and production MUST use separate Supabase projects."
            exit 1
          fi
          # Verify staging URL contains the staging project ref
          if echo "$STAGING_URL" | grep -q "lirnqrcjbjncumwxrlqo"; then
            echo "✅ Staging URL points to staging project (lirnqrcjbjncumwxrlqo)"
          else
            echo "⚠️ Staging URL does not match expected staging project"
            echo "   Expected: https://lirnqrcjbjncumwxrlqo.supabase.co"
            echo "   Got: $STAGING_URL"
          fi
          echo "✅ Environment isolation verified"

      - name: Build for Staging
        env:
          VITE_APP_ENV: staging
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
          VITE_APP_PUBLIC_URL: ${{ secrets.STAGING_PUBLIC_URL }}
          VITE_SENTRY_DSN: ${{ secrets.STAGING_SENTRY_DSN }}
          VITE_ENABLE_PWA: 'true'
          VITE_ENABLE_REALTIME: 'true'
          VITE_ENABLE_OFFLINE: 'true'
        run: npx quasar build

      - name: Deploy to Netlify (Staging)
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: dist/spa
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Staging deploy — ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.STAGING_NETLIFY_SITE_ID }}

  smoke-test:
    name: Staging Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Wait for Deploy Propagation
        run: sleep 30

      - name: Health Check
        env:
          STAGING_URL: ${{ secrets.STAGING_PUBLIC_URL }}
        run: |
          echo "🔍 Running smoke tests against $STAGING_URL"

          # 1. App loads
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_URL")
          if [ "$STATUS" != "200" ]; then
            echo "❌ App returned HTTP $STATUS"
            exit 1
          fi
          echo "✅ App loads (HTTP 200)"

          # 2. Index contains expected content
          BODY=$(curl -s "$STAGING_URL")
          if echo "$BODY" | grep -q "Seven Waves"; then
            echo "✅ App title found"
          else
            echo "⚠️ App title not found in response"
          fi

          # 3. Security headers present
          HEADERS=$(curl -sI "$STAGING_URL")
          for HEADER in "x-content-type-options" "x-frame-options" "referrer-policy"; do
            if echo "$HEADERS" | grep -qi "$HEADER"; then
              echo "✅ Header: $HEADER"
            else
              echo "⚠️ Missing header: $HEADER"
            fi
          done

          echo "✅ Staging smoke tests passed"
